[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctk-kit"
version = "0.10.0"
description = "面向 CustomTkinter 的轻量界面基件：深浅色令牌、常用控件与懒加载列表"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "加点盐", email = "1431705288@qq.com" }]
keywords = [
    "customtkinter",
    "tkinter",
    "ui",
    "ui-kit",
    "theme",
    "dark-mode",
    "widgets",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "customtkinter>=5.2",
    # 抗锯齿绘制：勾选/单选指示符、Spinner 箭头、进度条与圆环、ImageViewer
    "pillow>=9",
    # 窗口大小/位置的持久化
    "conf_base>=0.5",
]

[project.optional-dependencies]
# 只有 PathField / DropZone 的拖入需要 tkinterdnd2，按钮选择路径不依赖它
dnd = ["tkinterdnd2>=0.3"]

[project.urls]
Homepage = "https://gitee.com/kuangjianke/ctk-kit"
Repository = "https://gitee.com/kuangjianke/ctk-kit"
Issues = "https://gitee.com/kuangjianke/ctk-kit/issues"
Changelog = "https://gitee.com/kuangjianke/ctk-kit/blob/main/CHANGELOG.md"
"GitHub Mirror" = "https://github.com/DashSalter/ctk-kit"

[tool.setuptools.packages.find]
include = ["ctk_kit*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
ctk_kit = ["py.typed"]
# core/ 里是编译好的 .pyd（和配套的 .pyi）；不显式写进来，wheel 里就只剩
# 一个空的 core/__init__.py，装上后 import 立刻失败。
"ctk_kit.core" = ["*.pyd", "*.pyi"]
