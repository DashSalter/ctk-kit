[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctk-kit"
version = "0.2.0"
description = "面向 CustomTkinter 的轻量界面基件：深浅色令牌、常用控件与懒加载列表"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "加点盐", email = "1431705288@qq.com" }]
keywords = [
    "customtkinter",
    "tkinter",
    "ui",
    "ui-kit",
    "theme",
    "dark-mode",
    "widgets",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = ["customtkinter>=5.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://gitee.com/kuangjianke/ctk-kit"
Repository = "https://gitee.com/kuangjianke/ctk-kit"
Issues = "https://gitee.com/kuangjianke/ctk-kit/issues"
Changelog = "https://gitee.com/kuangjianke/ctk-kit/blob/main/CHANGELOG.md"
"GitHub Mirror" = "https://github.com/DashSalter/ctk-kit"

[tool.setuptools.packages.find]
include = ["ctk_kit*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
ctk_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
